<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#b90000">
  <meta name="description" content="Офлайн-генератор ориентировок КПЦ Симбирск">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=Roboto+Condensed:wght@400;500&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <title>КПЦ Симбирск — ориентировка</title>
</head>
<body>
<header class="app-header">
  <div>
    <h1>КПЦ Симбирск</h1>
    <p>Создание ориентировки</p>
  </div>
  <div class="status-wrap">
    <span id="netStatus" class="badge">Проверяю сеть…</span>
    <button id="installBtn" class="ghost small" hidden>Установить</button>
  </div>
</header>

<main id="layout" class="layout">
  <section class="card form-card">
    <div class="section"><h2>Человек</h2><div class="grid">
      <label>Фамилия<input id="lastName" autocomplete="family-name" placeholder="Иванов"></label>
      <label>Имя и отчество<input id="firstMiddleName" placeholder="Иван Иванович"></label>
      <label>Возраст<input id="age" inputmode="text" placeholder="35 лет (1989 г.р.)"></label>
      <label>Дата пропажи<input id="date" type="date"></label>
      <label class="full">Место пропажи<textarea id="place" placeholder="г. Ульяновск, Засвияжский район"></textarea></label>
    </div></div>
    <div class="section"><h2>Приметы</h2><div class="grid">
      <label>Рост<input id="height" placeholder="175 см"></label>
      <label>Телосложение<input id="build" placeholder="среднее"></label>
      <label>Волосы<input id="hair" placeholder="тёмно-русые, короткие"></label>
      <label>Глаза<input id="eyes" placeholder="карие"></label>
      <label class="full">Особые приметы<textarea id="special" placeholder="шрам на правой брови"></textarea></label>
    </div></div>
    <div class="section"><h2>Был одет</h2><div class="grid">
      <label>Куртка<input id="jacket" placeholder="тёмно-серая"></label>
      <label>Брюки<input id="pants" placeholder="джинсы, тёмные"></label>
      <label>Обувь<input id="shoes" placeholder="кроссовки чёрные"></label>
      <label>При себе<input id="carrying" placeholder="чёрный рюкзак"></label>
    </div></div>
    <div class="section"><h2>Фото</h2><div class="photo-picker">
      <input id="photo" type="file" accept="image/jpeg,image/png,image/webp" capture="environment">
      <img id="photoThumb" alt="" hidden>
      <p>Фото хранится только на этом устройстве, пока вы сами не отправите готовый файл.</p>
    </div></div>
    <div class="section"><h2>Актуальность</h2><label>Актуально на<input id="actual" type="date"></label></div>
    <div class="actions">
      <button id="previewBtn" class="secondary">Открыть предпросмотр</button>
      <button id="pdfBtn" class="primary">Создать PDF</button>
      <button id="clearBtn" class="ghost">Очистить</button>
    </div>
    <p id="message" class="message"></p>
  </section>
  <section id="previewCard" class="card preview-card" hidden>
    <div class="preview-head"><h2>Предпросмотр</h2><span>A4</span></div>
    <div class="poster-shell"><canvas id="poster" width="1024" height="1536" aria-label="Предпросмотр ориентировки"></canvas></div>
  </section>
</main>
<script src="app-v5.js?v=12"></script>
</body>
</html>
